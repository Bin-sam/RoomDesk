<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房间管理 · 栖间</title><link rel="stylesheet" href="/style.css"></head><body><main class="management-page">
<header><div class="page-title"><div class="brand-mark">栖</div><div><h1>房间管理 <span class="preview-badge">Mac 功能预览</span></h1><p>集中查看房间数量、楼层和房型，维护客房清单。</p></div></div><div class="head-actions"><a class="nav-link" href="/">← 返回房态总览</a></div></header>
<section class="management-summary" aria-label="房间规模"><article><span>房间总数</span><strong id="room-total">—</strong><small>间</small></article><article><span>楼层数量</span><strong id="floor-total">—</strong><small>层</small></article><article><span>房型数量</span><strong id="type-total">—</strong><small>种</small></article></section>
<div class="management-layout"><section class="management-list"><div class="management-heading"><h2>房间清单</h2><button id="manage-refresh">↻ 刷新</button></div><div class="management-filters"><input id="manage-query" type="search" aria-label="搜索房间资料" placeholder="搜索房号或房型"><select id="manage-floor" aria-label="筛选管理楼层"><option value="all">全部楼层</option></select></div><p id="manage-result" role="status"></p><div class="management-table-wrap"><table class="management-table"><thead><tr><th>房号</th><th>楼层</th><th>房型</th><th>当前房态</th><th>默认价格（元）</th></tr></thead><tbody id="manage-rows"></tbody></table></div><div class="floor-summary" id="floor-summary"></div></section>
<aside class="management-form"><h2>新增房间</h2><p>添加成功后，房态总览会显示新房间。房间总数按实际清单自动统计。</p><form id="manage-add-form"><label>房号<input name="number" type="number" min="1" max="99999" required placeholder="例如 401"></label><label>楼层<input name="floor" type="number" min="1" max="99" value="1" required></label><label>房型<select name="type"><option value="Standard">标准间</option><option value="Deluxe">豪华房</option><option value="ExecutiveSuite">行政套房</option><option value="VipSuite">贵宾套房</option><option value="Penthouse">顶层套房</option></select></label><label>默认价格（元）<input name="defaultPrice" type="number" min="0" max="99999999.99" step="0.01" placeholder="可稍后设置"></label><p class="management-tip">新房间初始为待清扫，清扫完成后可办理入住。</p><p id="manage-error" class="form-error" role="alert"></p><button id="manage-save" class="primary" type="submit" disabled>添加房间</button></form></aside></div>
<footer><span id="manage-feedback" role="status">正在读取房间清单…</span><span>本机保存 · 房间资料设置</span></footer></main><script src="/room-management.js"></script></body></html>
