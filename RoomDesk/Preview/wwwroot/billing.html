<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入住账单 · 栖间</title><link rel="stylesheet" href="/style.css"></head><body><main class="management-page"><header><div><h1>入住账单</h1><p>按入住时间筛选 · 北京时间 · 售出总价不代表已收款金额</p></div><a class="nav-link" href="/">返回房态总览</a></header><section class="management-list"><form id="bill-form" class="bill-filters"><label>开始时间（含）<input id="bill-start" type="datetime-local" step="60" required></label><label>结束时间（含该分钟）<input id="bill-end" type="datetime-local" step="60" required></label><button class="primary" type="submit">查询账单</button><button type="button" id="bill-export" disabled>导出 CSV 🔒</button></form><p>例如结束时间为 18:30，包含 18:30:00–18:30:59 的入住。未登记价格的历史记录单独计数。</p><div class="management-summary"><article><span>入住笔数</span><strong id="bill-count">—</strong></article><article><span>已登记售出总额</span><strong id="bill-total">—</strong><small>元</small></article><article><span>未登记价格</span><strong id="bill-unpriced">—</strong><small>笔</small></article></div><p id="bill-message" role="status"></p><div class="management-table-wrap"><table class="management-table"><thead><tr><th>房号</th><th>入住人</th><th>入住时间</th><th>状态</th><th>售出总价（元）</th></tr></thead><tbody id="bill-rows"></tbody></table></div><p>页面最多预览 100 笔；CSV 导出该时间段全部记录及合计。</p></section></main><script src="/security.js"></script><script src="/billing.js"></script></body></html>
