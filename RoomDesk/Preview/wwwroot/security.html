<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据与安全 · 栖间</title><link rel="stylesheet" href="/style.css"></head><body><main class="settings-page"><header><div><h1>数据与安全</h1><p>导出、备份及删除记录时，可选择验证后 5 分钟免重复输入。</p></div><a class="nav-link" href="/">返回房态总览</a></header><section class="management-form"><h2>操作密码</h2><p id="password-state" role="status">正在读取…</p><form id="password-form"><label id="current-password-label">当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128"></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><p>设置 8–128 位密码。修改密码需要验证当前密码。</p><p class="form-error" id="password-error" role="alert"></p><button class="primary" id="password-save" disabled>保存密码</button></form></section><section class="management-form"><h2>本地备份</h2><p>备份包含房间、入住记录、价格及密码设置。</p><button id="secure-backup">验证密码并备份</button><p id="backup-status" role="status"></p></section><section class="management-form"><h2>磁盘保存与自动备份</h2><p>每次保存成功后已提交到磁盘。程序运行时每天自动备份，保留最近 7 份；手动备份不受影响。</p><p id="storage-status" class="storage-details" role="status">正在读取存储状态…</p></section><section class="management-form"><h2>免密授权</h2><p>验证后 5 分钟内免重复输入；关闭弹窗仍有效。密码修改或程序重启后失效。</p><button id="lock-session">立即锁定</button><p id="lock-status" role="status"></p></section><section class="management-form"><h2>软件更新</h2><p>当前版本：0.8.0 预览版</p><button id="check-update">检查更新</button><p id="update-status" role="status">此处是 Mac 浏览器预览。Windows 安装版支持下载、备份、安装并重启。</p><pre id="update-notes" class="storage-details"></pre></section></main><script src="/security.js"></script><script src="/settings.js"></script><script src="/hotel-brand.js"></script></body></html>
