<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据与安全 · 栖间</title><link rel="stylesheet" href="/style.css"></head><body><main class="settings-page"><header><div><h1>数据与安全</h1><p>导出、备份及删除记录时，每次验证操作密码。</p></div><a class="nav-link" href="/">返回房态总览</a></header><section class="management-form"><h2>操作密码</h2><p id="password-state" role="status">正在读取…</p><form id="password-form"><label id="current-password-label">当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128"></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><p>设置 8–128 位密码。修改密码需要验证当前密码。</p><p class="form-error" id="password-error" role="alert"></p><button class="primary" id="password-save" disabled>保存密码</button></form></section><section class="management-form"><h2>本地备份</h2><p>备份包含房间、入住记录、价格及密码设置。</p><button id="secure-backup">验证密码并备份</button><p id="backup-status" role="status"></p></section></main><script src="/security.js"></script><script src="/settings.js"></script></body></html>
