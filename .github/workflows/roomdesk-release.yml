name: RoomDesk Windows release
on:
  workflow_dispatch:
  push:
    tags: ['roomdesk-v*']
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shared core
        shell: pwsh
        run: |
          dotnet run --project RoomDesk/Tests/Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test HTTP and front desk scenarios
        shell: pwsh
        run: |
          dotnet build RoomDesk/Preview/Preview.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build RoomDesk/Benchmarks/Benchmarks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dotnet = (Get-Command dotnet).Source
          python RoomDesk/Tests/api_smoke.py $dotnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python RoomDesk/Tests/front_desk_scenarios.py $dotnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish RoomDesk/Windows/Windows.csproj -c Release -r win-x64 --self-contained true -p:Version=0.7.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o RoomDesk/artifacts/windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gate million-row latency and native WPF memory
        shell: pwsh
        run: ./RoomDesk/installer/performance-gate.ps1 -Application "$PWD/RoomDesk/artifacts/windows-x64/RoomDesk.exe"
      - name: Preserve Windows performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-Windows-performance
          path: RoomDesk/artifacts/validation/*.json
          if-no-files-found: warn
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable on this runner.' }
          & $compiler /DAppVersion=0.7.0 RoomDesk/installer/RoomDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE RoomDesk/artifacts/windows-x64/LICENSE
          Copy-Item RoomDesk/installer/INSTALL-WINDOWS.txt RoomDesk/artifacts/windows-x64/
          Copy-Item RoomDesk/installer/licenses RoomDesk/artifacts/windows-x64/licenses -Recurse
          Compress-Archive -Path RoomDesk/artifacts/windows-x64/* -DestinationPath RoomDesk/artifacts/release/RoomDesk-Portable-0.7.0-win-x64.zip
      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem RoomDesk/artifacts/release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content RoomDesk/artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release/*
          if-no-files-found: error
  installer:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release
      - name: Test installation, launch, reinstall and uninstall
        timeout-minutes: 6
        shell: pwsh
        run: ./RoomDesk/installer/smoke-install.ps1 -Installer "$PWD/RoomDesk/artifacts/release/RoomDesk-Setup-0.7.0-win-x64.exe"
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-installer-diagnostics
          path: ${{ runner.temp }}/roomdesk-*.log
          if-no-files-found: ignore
  publish:
    needs: [windows, installer]
    if: startsWith(github.ref, 'refs/tags/roomdesk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" RoomDesk/artifacts/release/* --verify-tag --prerelease --title "RoomDesk 0.7.0 — Windows preview" --notes-file RoomDesk/installer/RELEASE-NOTES.md
