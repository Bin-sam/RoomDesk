name: RoomDesk Windows release
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests for an explicitly requested build-only release
        type: boolean
        default: false
      publish_release:
        description: Publish the built version to GitHub Releases
        type: boolean
        default: false
  push:
    tags: ['roomdesk-v*']
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version consistency
        shell: pwsh
        run: |
          $source = Get-Content RoomDesk/Core/SoftwareUpdates.cs -Raw
          $tag = [regex]::Match($source,'CurrentTag="([^"]+)"').Groups[1].Value
          $version = [regex]::Match($source,'CurrentVersion="([^"]+)"').Groups[1].Value
          $props = [xml](Get-Content RoomDesk/Directory.Build.props -Raw)
          if ($props.Project.PropertyGroup.Version -ne $version -or $version -ne '0.8.3') { throw 'Release version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match the built updater version' }
      - name: Test shared core
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          dotnet run --project RoomDesk/Tests/Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test HTTP and front desk scenarios
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          dotnet build RoomDesk/Preview/Preview.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build RoomDesk/Benchmarks/Benchmarks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dotnet = (Get-Command dotnet).Source
          python RoomDesk/Tests/api_smoke.py $dotnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python RoomDesk/Tests/front_desk_scenarios.py $dotnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish RoomDesk/Windows/Windows.csproj -c Release -r win-x64 --self-contained true -p:Version=0.8.3 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o RoomDesk/artifacts/windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable on this runner.' }
          & $compiler /DAppVersion=0.8.3 RoomDesk/installer/RoomDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE RoomDesk/artifacts/windows-x64/LICENSE
          Copy-Item RoomDesk/installer/INSTALL-WINDOWS.txt RoomDesk/artifacts/windows-x64/
          Copy-Item RoomDesk/installer/licenses RoomDesk/artifacts/windows-x64/licenses -Recurse
          Compress-Archive -Path RoomDesk/artifacts/windows-x64/* -DestinationPath RoomDesk/artifacts/release/RoomDesk-Portable-0.8.3-win-x64.zip
      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem RoomDesk/artifacts/release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content RoomDesk/artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release/*
          if-no-files-found: error
  performance:
    if: ${{ !inputs.skip_tests }}
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release
      - name: Extract the built application
        shell: pwsh
        run: Expand-Archive RoomDesk/artifacts/release/RoomDesk-Portable-0.8.3-win-x64.zip RoomDesk/artifacts/portable
      - name: Gate million-row latency and native WPF memory
        shell: pwsh
        run: ./RoomDesk/installer/performance-gate.ps1 -Application "$PWD/RoomDesk/artifacts/portable/RoomDesk.exe"
      - name: Preserve Windows performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-Windows-performance
          path: RoomDesk/artifacts/validation/*.json
          if-no-files-found: warn
  installer:
    if: ${{ !inputs.skip_tests }}
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release
      - name: Test installation, launch, reinstall and uninstall
        timeout-minutes: 6
        shell: pwsh
        run: ./RoomDesk/installer/smoke-install.ps1 -Installer "$PWD/RoomDesk/artifacts/release/RoomDesk-Setup-0.8.3-win-x64.exe"
      - name: Test update helper across versions
        timeout-minutes: 7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./RoomDesk/installer/smoke-upgrade.ps1 -Installer "$PWD/RoomDesk/artifacts/release/RoomDesk-Setup-0.8.3-win-x64.exe"
      - name: Preserve upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-upgrade-validation
          path: RoomDesk/artifacts/upgrade-validation/*
          if-no-files-found: ignore
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomDesk-installer-diagnostics
          path: ${{ runner.temp }}/roomdesk-*.log
          if-no-files-found: ignore
  publish:
    needs: [windows, installer, performance]
    if: ${{ always() && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/roomdesk-v') || inputs.publish_release) && ((inputs.skip_tests && github.event_name == 'workflow_dispatch') || (needs.installer.result == 'success' && needs.performance.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RoomDesk-Windows-x64
          path: RoomDesk/artifacts/release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(awk -F '"' '/public const string CurrentTag=/{print $2}' RoomDesk/Core/SoftwareUpdates.cs)
          release_version=$(awk -F '"' '/public const string CurrentVersion=/{print $2}' RoomDesk/Core/SoftwareUpdates.cs)
          cp RoomDesk/installer/RELEASE-NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nSource: `%s`\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$release_tag" RoomDesk/artifacts/release/* --target "$GITHUB_SHA" --prerelease --title "RoomDesk $release_version — 一屏自适应房态" --notes-file "$RUNNER_TEMP/release-notes.md"
